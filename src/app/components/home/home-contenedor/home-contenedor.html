<div class="container mt-4">
    <h1 class="text-center fw-bold">{{titulo}}</h1>

    <div class="row">
        <!--Filtro y Busqueda-->
        <!--Componente para filtrar eventos-->
        <app-filtro-eventos class="col-md-4" [tipos]="tiposEventos()" (filtroCamiado)="aplicarFiltro($event)">
        </app-filtro-eventos>

        <!--Componente para buscar-->
        <app-barra-busqueda class="col-md-8"></app-barra-busqueda>
    </div>

    <div class="row mt-4">
        @for (evento of eventosFiltrados(); track evento.id) {
        <div class="col-md-4 mb-3">
            <!--Inyectamos los datos al componente tarjeta-evento-->
            <app-tarjeta-eventos [evento]="evento" [nombreTipo]="obtenerNombreDelTipoDeEvento(evento.tipoEventoId)">
            </app-tarjeta-eventos>
            
            <!-- 💡 TU BOTÓN DE ACCIÓN: Envía el ID real del evento al TypeScript al hacer clic -->
            <div class="d-grid mt-2">
                <button type="button" class="btn btn-outline-primary btn-sm" (click)="abrirComentarios(evento.id)">
                    Ver Comentarios
                </button>
            </div>
        </div>
        }

        @if (eventosFiltrados().length == 0) {
        <div class="col-12 text-center text-muted mt-5">
            <h4>No se encontraron eventos de este tipo.</h4>
        </div>
        }
    </div>
</div>


<!-- Al final de tu archivo home-contenedor.html -->
@if (eventoAbiertoId()) {
    <section class="bg-light py-5 mt-5 border-top">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-dark m-0">Gestión del Sistema de Comentarios</h2>
                    <p class="text-muted small mb-0">Visualizando opiniones del Evento ID: #{{ eventoAbiertoId() }}</p>
                </div>
                <button type="button" class="btn btn-sm btn-secondary" (click)="cerrarComentarios()">✕ Cerrar</button>
            </div>

            <div class="card shadow-sm p-4 bg-white rounded">
                <!-- Pasamos el valor actual de la Signal a tu Input del componente -->
                <app-comentarios [eventoId]="eventoAbiertoId()!"></app-comentarios>
            </div>
        </div>
    </section>
}
