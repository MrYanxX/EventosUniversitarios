<div class="card h-100 shadow-sm">
  <img [src]="evento.imagen" 
       class="card-img-top" 
       alt="Imagen del evento {{ evento.titulo }}" 
       style="height: 200px; width: 100%; object-fit: cover;">
  
  <div class="card-body d-flex flex-column">
    <h5 class="card-title fw-bold">{{ evento.titulo }}</h5>
    
    <div class="mb-3">
      <span class="badge bg-primary me-2">{{ nombreTipo }}</span>
      <span class="badge bg-secondary">📅 {{ evento.fecha }}</span>
    </div>
    
    <p class="card-text text-muted mb-4" 
       style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">
      {{ evento.detalles }}
    </p>
    
    <button class="btn btn-outline-primary w-100 mt-auto" (click)="verDetallesEvento(evento.id)">
        Ver Detalles
    </button>
  </div>
</div>
