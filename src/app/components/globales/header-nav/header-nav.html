<header class="bg-dark text-white p-3 d-flex justify-content-between align-items-center">
  <a class="text-white text-decoration-none" routerLink="/home">
    <h4 class="mb-0">UG | Sistema de Eventos</h4>
  </a>

  <div class="d-flex align-items-center">
    <a routerLink="/eventos" class="text-white me-3 text-decoration-none"> Eventos </a>

    <a routerLink="/inscripciones" class="text-white me-3 text-decoration-none">
      Inscripciones
    </a>

    <a routerLink="/ponentes" class="text-white me-3 text-decoration-none"> Ponentes </a>

    <a routerLink="/recursos" class="text-white me-3 text-decoration-none"> Recursos </a>

    @if (estaLogueado) {
      @if (esOrganizador) {
        <a routerLink="/dashboard-organizador" class="text-white me-3 text-decoration-none">
          Mi Dashboard
        </a>
        <a routerLink="/organizadores" class="text-white me-3 text-decoration-none">
          Organizadores
        </a>
      } @else {
        <a routerLink="/cuenta" class="text-white me-3 text-decoration-none"> Mi Cuenta </a>
      }

      <button class="btn btn-danger" (click)="logout()">Salir</button>
    } @else {
      <button class="btn btn-primary" (click)="irCuenta()">Iniciar Sesión</button>
    }
  </div>
</header>
