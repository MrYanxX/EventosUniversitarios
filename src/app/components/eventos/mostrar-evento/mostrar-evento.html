<div class="container">
    @if (evento(); as ev) {
    <div>
        <div>
            <img [src]="ev.imagen" class="img-fluid rounded shadow-sm mb-4 w-100"
                style="max-height: 400px; object-fit: cover;" alt="Imagen de {{ ev.titulo }}">

            <h1 class="fw-bold mb-3">{{ ev.titulo }}</h1>

            <div class="d-flex gap-2 mb-4">
                <span class="badge bg-primary fs-6 py-2 px-3">
                    {{ tipoEvento() }}
                </span>
                <span class="badge bg-secondary fs-6 py-2 px-3">
                    📅 {{ ev.fecha }}
                </span>
            </div>

            <div class="card shadow-sm mb-4 border-0 bg-light">
                <div class="card-body p-4">
                    <h4 class="card-title fw-bold border-bottom pb-2 mb-3">Detalles del evento</h4>
                    <p class="card-text text-muted" style="white-space: pre-wrap; font-size: 1.1rem;">
                        {{ ev.detalles }}
                    </p>
                </div>
            </div>

            <button class="btn btn-outline-primary btn-lg fw-bold" (click)="abrirListaInscritos()">
                Ver lista de inscritos
            </button>
        </div>
    </div>

    <div class="row mt-5 border-top pt-5">
        <div class="col-12">
            <div class="card shadow-sm border-0 rounded p-4 bg-white">
                <app-comentarios [eventoId]="$any(ev.id)"></app-comentarios>
            </div>
        </div>
    </div>

    <!-- Hacemos lo mismo aquí abajo por si acaso -->
    <app-leer-inscripciones [eventoId]="$any(ev.id)"></app-leer-inscripciones>

    }

</div>
