<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold m-0">Administración de Eventos</h2>
        <a routerLink="/crear-evento" class="btn text-white fw-bold bg-primary border-0">
            + Nuevo Evento
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Imagen</th>
                        <th>Título</th>
                        <th>Fecha</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    @for (evento of eventos(); track evento.id) {
                        <tr class="align-middle">
                            <td>
                                <img [src]="evento.imagen" class="rounded border" style="width: 50px; height: 50px; object-fit: cover;">
                            </td>
                            <td class="fw-bold">{{ evento.titulo }}</td>
                            <td>{{ evento.fecha }}</td>
                            <td class="text-center">
                                <!-- ESTE BOTÓN ES LA MAGIA: Nos lleva al formulario pero pasándole el ID -->
                                <a [routerLink]="['/editar-evento', evento.id]" class="btn btn-sm btn-outline-primary me-2">
                                    ✏️ Editar
                                </a>
                                <button class="btn btn-sm btn-outline-danger" (click)="eliminarEvento(evento)">
                                    ❌ Eliminar
                                </button>
                            </td>
                        </tr>
                    }

                    @if (eventos().length === 0) {
                        <tr>
                            <td colspan="5" class="text-center py-5 text-muted">
                                No tienes eventos creados.
                            </td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>
