<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold m-0">Inscripción a Eventos</h2>
    </div>

    <!-- Buscador -->
    <div class="card shadow-sm border-0 mb-4 p-3 bg-light">
        <input type="text" class="form-control form-control-lg border-0 shadow-sm" 
               placeholder="🔍 Buscar evento por título..." 
               (input)="actualizarBusqueda($event)">
    </div>

    <div class="row g-4">
        @for (evento of eventosFiltrados(); track evento.id) {
            <div class="col-md-4">
                <div class="card shadow-sm border-0 h-100">
                    <img [src]="evento.imagen" class="card-img-top" style="height: 200px; object-fit: cover;">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title fw-bold">{{ evento.titulo }}</h5>
                        <p class="text-muted small mb-3">📅 {{ evento.fecha }}</p>
                        <a [routerLink]="['/nueva-inscripcion', evento.id]" class="btn btn-primary mt-auto fw-bold w-100">
                            Inscribirse
                        </a>
                    </div>
                </div>
            </div>
        }

        @if (eventosFiltrados().length === 0) {
            <div class="col-12 text-center py-5 text-muted">
                No se encontraron eventos con esa búsqueda.
            </div>
        }
    </div>
</div>
